name: YouTube access probe

# Checks whether YouTube lets a GitHub runner list streams and download chat
# replays without a bot check. Temporary: decides whether the daily data
# update can run here instead of on a home connection.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet yt-dlp==2026.10.26
      - name: Probe
        run: |
          ok=0; fail=0
          report() { echo "| $1 | $2 | $3 |" >> "$GITHUB_STEP_SUMMARY"; }
          echo "| request | result | detail |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          n=$(yt-dlp --flat-playlist --print id "https://www.youtube.com/@LibAndLearn/streams" 2> err.txt | wc -l)
          if [ "$n" -gt 0 ]; then ok=$((ok+1)); report "streams tab listing" "ok" "$n videos"; else fail=$((fail+1)); echo "LISTING FAILED:"; cat err.txt; report "streams tab listing" "blocked" "$(tail -c 200 err.txt | tr '\n|' '  ')"; fi
          for v in 1Q029nWXeV8 jjVuJn_Um80; do
            sleep 20
            rm -f ./*.live_chat.json*
            yt-dlp --skip-download --write-subs --sub-langs live_chat -o "%(id)s.%(ext)s" "https://www.youtube.com/watch?v=$v" > out.txt 2> err.txt || true
            if [ -s "$v.live_chat.json" ]; then
              ok=$((ok+1)); report "chat replay $v" "ok" "$(wc -l < "$v.live_chat.json") lines, $(grep -o liveChatPaidMessageRenderer "$v.live_chat.json" | wc -l) paid messages"
            else
              fail=$((fail+1)); echo "CHAT $v FAILED:"; tail -5 err.txt; tail -3 out.txt; report "chat replay $v" "blocked" "$(tail -c 200 err.txt | tr '\n|' '  ')"
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"; echo "**$ok ok, $fail blocked**" >> "$GITHUB_STEP_SUMMARY"
          echo "RESULT ok=$ok fail=$fail"
          [ "$fail" -eq 0 ]
